<svg xmlns="http://www.w3.org/2000/svg" viewBox="117 102 790 790">
  <!-- The Lowkey mark alone, no tile: indigo on light tabs, pale on dark ones (as on the Download page). -->
  <style>
    .a { stop-color: #5e6ad2; } .b { stop-color: #2b2f5c; } .bar, .refl { fill: #5e6ad2; }
    @media (prefers-color-scheme: dark) { .a { stop-color: #e9e9ee; } .b { stop-color: #8d93c9; } .refl { fill: #b9bde6; } }
  </style>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="a" /><stop offset="1" class="b" /></linearGradient>
    <mask id="cut"><rect x="-200" y="-200" width="1424" height="1424" fill="#fff" /><g fill="#000"><rect y="486" width="1024" height="8" /><rect y="522" width="1024" height="12" /><rect y="558" width="1024" height="16" /></g></mask>
    <clipPath id="up"><rect width="1024" height="586" /></clipPath>
  </defs>
  <g transform="translate(512 512) scale(1.25) translate(-512 -497)">
    <circle cx="512" cy="470" r="230" fill="url(#sun)" mask="url(#cut)" clip-path="url(#up)" />
    <rect x="200" y="596" width="624" height="18" rx="9" class="bar" />
    <g class="refl">
      <rect x="330" y="644" width="364" height="14" rx="7" opacity=".6" /><rect x="380" y="682" width="264" height="12" rx="6" opacity=".42" />
      <rect x="430" y="716" width="164" height="10" rx="5" opacity=".28" /><rect x="470" y="746" width="84" height="8" rx="4" opacity=".16" />
    </g>
  </g>
</svg>
